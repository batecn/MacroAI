    /* 页面增量样式（品牌组件复用 css/style.css） */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 28px; max-width: 1120px; margin: 0 auto; }
    .game-card { padding: 22px; display: flex; flex-direction: column; gap: 14px; cursor: default; }
    .game-card .shot { border-radius: 12px; overflow: hidden; border: 1px solid rgba(255,255,255,0.08); aspect-ratio: 960/604; background: #14121f; }
    .game-card .shot img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .game-card h3 { font-size: 1.15rem; }
    .game-card .desc { color: var(--text-secondary); font-size: 0.92rem; line-height: 1.65; flex: 1; }
    .game-card .tags { display: flex; gap: 8px; flex-wrap: wrap; }
    .platform-tag { background: rgba(71,119,255,0.18); color: #8fb0ff; border-radius: 999px; padding: 3px 10px; font-size: 0.78rem; }
    .game-card .actions { display: flex; gap: 12px; flex-wrap: wrap; }
    .ghost-card { display: flex; align-items: center; justify-content: center; color: var(--text-secondary); font-size: 0.95rem; min-height: 220px; border-style: dashed; }
    .steps-grid { max-width: 860px; margin: 0 auto; }
    .steps-grid .glass-card { padding: 26px; }
    @media (max-width: 720px) { .games-grid { grid-template-columns: 1fr; } }
  </style>
